name: ARTEMIS Android and ARM64 Compatibility Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/android-termux-compat-audit.yml"
  push:
    branches:
      - main
      - "ci/android-termux-compat-audit"

permissions:
  contents: read

jobs:
  linux-validation:
    name: Linux dependency and test validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check lockfile
        run: uv lock --check
      - name: Validate startup shell syntax
        run: bash -n start.sh
      - name: Resolve dependencies without installing them
        run: uv sync --dry-run --no-install-project
      - name: Install locked development environment
        run: uv sync --dev --locked
      - name: Configure fake credentials for offline tests
        shell: bash
        run: |
          cat > .env <<'ENV'
          GOOGLE_API_KEY=ci-not-a-real-key
          GEMINI_API_KEY=ci-not-a-real-key
          ENV
          echo "GOOGLE_API_KEY=ci-not-a-real-key" >> "$GITHUB_ENV"
          echo "GEMINI_API_KEY=ci-not-a-real-key" >> "$GITHUB_ENV"
      - name: Run deterministic Python tests
        run: >-
          uv run pytest
          tests/unit
          tests/tools
          packages/artemis-client/tests
          -q
          --cov=artemis
          --cov=mcp_server
          --cov=apps/admin_console
          --cov=third_party
          --cov-fail-under=60

  android-wheel-audit:
    name: Android ARM64 wheels / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Probe native dependencies
        shell: bash
        run: |
          mkdir -p audit/wheels
          packages=(numpy scipy opencv-python pyarrow grpcio uvloop httptools cryptography lxml pillow pyzmq cffi greenlet)
          python_tag="$(python -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")')"
          report="audit/android-arm64-wheels-cp${python_tag}.txt"
          : > "$report"
          for package in "${packages[@]}"; do
            echo "=== $package ===" | tee -a "$report"
            if python -m pip download \
              --only-binary=:all: --no-deps \
              --platform android_24_arm64_v8a \
              --implementation cp --python-version "$python_tag" --abi "cp${python_tag}" \
              --dest audit/wheels "$package" \
              >> "$report" 2>&1; then
              echo "RESULT=ANDROID_WHEEL_AVAILABLE" | tee -a "$report"
            else
              echo "RESULT=NO_MATCHING_ANDROID_WHEEL" | tee -a "$report"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-arm64-wheel-audit-py${{ matrix.python }}
          path: audit/
          if-no-files-found: warn
